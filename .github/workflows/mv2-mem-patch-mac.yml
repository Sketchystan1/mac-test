name: macOS MV2 mem-patch testbed

# Builds + installs the in-repo macOS in-process MV2 mem-patch (mv2-mem-patch-mac/)
# on a fresh Google Chrome, verifies it, then hands you a VNC desktop (same rig as
# mac.yml) so you can load a real Manifest V2 extension and confirm it works live.

on:
  workflow_dispatch:
    inputs:
      ARCH:
        description: 'Architecture'
        type: choice
        options:
          - arm64
          - x64
        default: arm64
      MAC_PASSWORD:
        description: 'VNC password (required if not set in Secrets, max 8 chars)'
        required: false
      APPLY_PATCH:
        description: 'Inject + re-sign Chrome (uncheck to only build & offline-inspect)'
        type: boolean
        default: true
      INJECT_METHOD:
        description: 'How to load the dylib'
        type: choice
        options:
          - dyld
          - loadcmd
        default: dyld
      SMOKE_TEST:
        description: 'Run checks then exit (skip the 6h VNC desktop)'
        type: boolean
        default: false
      BREW_PACKAGES:
        description: 'Extra software to install (brew names, space or comma separated)'
        required: false
        default: ''

jobs:
  testbed:
    # macos-13 is the last Intel runner image GitHub offers; it is being phased
    # out. When it is retired, x64 will fail to queue. The patch dylib is built
    # universal (arm64 + x86_64) either way.
    runs-on: ${{ inputs.ARCH == 'x64' && 'macos-13' || 'macos-latest' }}
    timeout-minutes: 360
    # A new dispatch of the same arch cancels the previous run so old sessions
    # don't silently burn the full 6h timeout in the background.
    concurrency:
      group: ${{ github.workflow }}-${{ inputs.ARCH }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out this repo (for mv2-mem-patch-mac/)
        uses: actions/checkout@v4

      - name: Build & install MV2 mem-patch
        env:
          APPLY_PATCH: ${{ inputs.APPLY_PATCH }}
          MV2_INJECT: ${{ inputs.INJECT_METHOD }}
          BREW_PACKAGES: ${{ inputs.BREW_PACKAGES }}
          ARCH: ${{ inputs.ARCH }}
        run: |
          CHROME_APP="/Applications/Google Chrome.app"

          # --- Google Chrome + any extra requested packages -------------------
          echo "📦 installing Google Chrome ..."
          HOMEBREW_NO_AUTO_UPDATE=1 brew install --cask google-chrome \
            || echo "::warning::google-chrome cask install reported an issue"

          # Optional software requested at dispatch time. Casks are GUI apps,
          # formulae are CLI tools.
          if [ -n "$BREW_PACKAGES" ]; then
            for PKG in $(printf '%s' "$BREW_PACKAGES" | tr ',' ' '); do
              echo "📦 brew install $PKG"
              if brew info --cask "$PKG" > /dev/null 2>&1; then
                HOMEBREW_NO_AUTO_UPDATE=1 brew install --cask "$PKG" \
                  || echo "::warning::Failed to install cask: $PKG"
              else
                HOMEBREW_NO_AUTO_UPDATE=1 brew install "$PKG" \
                  || echo "::warning::Failed to install formula: $PKG"
              fi
            done
          fi

          if [ ! -d "$CHROME_APP" ]; then
            echo "::error::Google Chrome not found at $CHROME_APP"
            exit 1
          fi
          CHROME_VER=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' \
            "$CHROME_APP/Contents/Info.plist" 2>/dev/null || echo unknown)

          # --- the in-repo patch sources (mv2-mem-patch-mac/) ----------------
          PATCH_SHA="${GITHUB_SHA:0:9}"
          cd "$GITHUB_WORKSPACE/mv2-mem-patch-mac"
          chmod +x build.sh install.sh

          # --- build (universal dylib + offline inspector) --------------------
          echo "🔨 ./build.sh ..."
          if ! ./build.sh; then
            echo "::error::build.sh failed"
            exit 1
          fi
          if [ ! -f mv2-mem-patch.dylib ] || [ ! -x mv2-inspect ]; then
            echo "::error::build did not produce mv2-mem-patch.dylib and mv2-inspect"
            exit 1
          fi

          # --- offline inspect (read-only: is this Chrome build covered?) -----
          echo "🔍 ./install.sh --offline ..."
          # Capture rc without tripping `bash -e` (GitHub runs steps with -e, so a
          # bare `VAR=$(failing-cmd)` would abort here before we can report).
          OFFLINE_OUT=$(./install.sh --offline "$CHROME_APP" 2>&1) && OFFLINE_RC=0 || OFFLINE_RC=$?
          printf '%s\n' "$OFFLINE_OUT"

          {
            echo "## 🧩 MV2 mem-patch — in-repo \`mv2-mem-patch-mac@$PATCH_SHA\`"
            echo "- **Chrome:** \`$CHROME_VER\` ($ARCH)"
            echo "- **Build:** ✅ universal dylib + inspector built"
            if [ $OFFLINE_RC -eq 0 ]; then
              echo "- **Offline inspect:** ✅ this Chrome build is covered by \`signatures.json\`"
            else
              echo "- **Offline inspect:** ❌ this Chrome build is NOT covered (rc=$OFFLINE_RC)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ $OFFLINE_RC -ne 0 ]; then
            echo "::error::Offline inspect failed — this Chrome version isn't in signatures.json. Not installing."
            {
              echo "<details><summary>mv2-inspect output</summary>"
              printf '\n```\n%s\n```\n</details>\n' "$OFFLINE_OUT"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$APPLY_PATCH" != "true" ]; then
            echo "APPLY_PATCH=false → built & inspected only; Chrome left stock."
            echo "- **Install:** ⏭️ skipped (APPLY_PATCH=false) — desktop runs stock Chrome" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # --- install (inject LC_LOAD_DYLIB + ad-hoc re-sign) ----------------
          echo "🛠  ./install.sh ..."
          if ! ./install.sh "$CHROME_APP"; then
            echo "::error::install.sh failed — see its output above (e.g. 'no room for a load command' = the Chrome executable has no Mach-O header padding to inject into; or an App-Management/TCC write block)"
            echo "- **Install:** ❌ install.sh failed (see logs)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # --- static verification -------------------------------------------
          EXE="$CHROME_APP/Contents/MacOS/Google Chrome"
          PY=$(command -v python3 || command -v python)
          VERIFY_OK=true

          # How the dylib is wired in depends on the method:
          #  - loadcmd: an LC_LOAD_DYLIB @loader_path/mv in the main exe
          #  - dyld:    DYLD_INSERT_LIBRARIES in the bundle's Info.plist LSEnvironment
          if [ "${MV2_INJECT:-dyld}" = loadcmd ]; then
            if "$PY" ./macho_insert_dylib.py present '@loader_path/mv' "$EXE"; then
              echo "✅ LC_LOAD_DYLIB @loader_path/mv present in main exe"
            else
              echo "::error::load command NOT present after install"; VERIFY_OK=false
            fi
          else
            if /usr/libexec/PlistBuddy -c 'Print :LSEnvironment:DYLD_INSERT_LIBRARIES' \
                 "$CHROME_APP/Contents/Info.plist" 2>/dev/null | grep -q '@executable_path/mv'; then
              echo "✅ LSEnvironment DYLD_INSERT_LIBRARIES=@executable_path/mv set in Info.plist"
            else
              echo "::error::LSEnvironment DYLD_INSERT_LIBRARIES not set after install"; VERIFY_OK=false
            fi
          fi

          if [ -f "$CHROME_APP/Contents/MacOS/mv" ]; then
            echo "✅ dylib placed beside the stub (Contents/MacOS/mv)"
          else
            echo "::error::dylib missing from the bundle (expected Contents/MacOS/mv)"
            VERIFY_OK=false
          fi

          if codesign --verify "$CHROME_APP" 2>/dev/null; then
            echo "✅ codesign --verify passed"
          else
            echo "::warning::codesign --verify reported issues (often benign for ad-hoc/mixed-signer bundles)"
          fi

          if [ "$VERIFY_OK" = true ]; then
            echo "- **Install:** ✅ patched via \`${MV2_INJECT:-dyld}\` & bundle re-signed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Install:** ❌ static verification failed (see logs)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Start VNC desktop
        # Runs even if the patch step failed (e.g. this Chrome isn't in
        # signatures.json yet) so you still get a desktop to investigate. The job
        # is still marked failed by the patch step, preserving the test signal.
        if: ${{ !cancelled() }}
        env:
          MAC_PASSWORD: ${{ secrets.MAC_PASSWORD || inputs.MAC_PASSWORD }}
          MV2_INJECT: ${{ inputs.INJECT_METHOD }}
          SMOKE_TEST: ${{ inputs.SMOKE_TEST }}
          ARCH: ${{ inputs.ARCH }}
        run: |
          if [ -z "$MAC_PASSWORD" ]; then
            echo "::error::Password is required. Set it in Settings > Secrets or in the workflow input."
            exit 1
          fi

          echo "::add-mask::$MAC_PASSWORD"

          if [ ${#MAC_PASSWORD} -gt 8 ]; then
            echo "::warning::Only the first 8 characters of the password are used."
          fi

          HOMEBREW_NO_AUTO_UPDATE=1 brew install cloudflared

          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/noVNC

          CONSOLE_USER=$(stat -f %Su /dev/console 2>/dev/null || true)
          if [ -z "$CONSOLE_USER" ] || [ "$CONSOLE_USER" = "root" ] || [ "$CONSOLE_USER" = "loginwindow" ]; then
            echo "::error::No active GUI console session found. Cannot provide a desktop."
            exit 1
          fi
          GUI_UID=$(id -u "$CONSOLE_USER")

          if [ "$CONSOLE_USER" != "admin" ]; then
            sudo dscl . -change "/Users/$CONSOLE_USER" RecordName "$CONSOLE_USER" admin 2>/dev/null || true
            CONSOLE_USER=admin
          fi
          export USER="$CONSOLE_USER" LOGNAME="$CONSOLE_USER"

          sudo sysadminctl -resetPasswordFor "$CONSOLE_USER" -newPassword "$MAC_PASSWORD" 2>/dev/null \
            || sudo dscl . -passwd "/Users/$CONSOLE_USER" "$MAC_PASSWORD" 2>/dev/null || true
          sudo dseditgroup -o edit -a "$CONSOLE_USER" -t user admin 2>/dev/null || true

          sudo systemsetup -setsleep Never 2>/dev/null || true
          sudo systemsetup -setdisplaysleep Never 2>/dev/null || true
          sudo pmset -a sleep 0 displaysleep 0 disksleep 0 powernap 0 2>/dev/null || true
          caffeinate -dimsu > caffeinate.log 2>&1 &

          # No screensaver - otherwise the session locks behind us mid-run.
          # sudo -H so `defaults` gets the target user's HOME for the ByHost plist.
          sudo -H -u "$CONSOLE_USER" defaults -currentHost write com.apple.screensaver idleTime 0 2>/dev/null || true
          sudo defaults write com.apple.universalaccess reduceTransparency -bool true
          sudo defaults write com.apple.universalaccess reduceMotion -bool true

          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCLegacyConnectionsAllowed -bool true
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAlwaysStartOnConsole -bool true

          TCC_DB="/Library/Application Support/com.apple.TCC/TCC.db"
          if [ -f "$TCC_DB" ]; then
            for SERVICE in kTCCServiceScreenCapture kTCCServiceAccessibility kTCCServicePostEvent; do
              sudo sqlite3 "$TCC_DB" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, csreq, policy_id, indirect_object_identifier_type, indirect_object_identifier, indirect_object_code_identity, flags, last_modified) VALUES ('$SERVICE', 'com.apple.screensharing.agent', 0, 2, 4, 1, NULL, NULL, 0, 'UNUSED', NULL, 0, strftime('%s','now'));" 2>/dev/null || true
              sudo sqlite3 "$TCC_DB" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, csreq, policy_id, indirect_object_identifier_type, indirect_object_identifier, indirect_object_code_identity, flags, last_modified) VALUES ('$SERVICE', 'com.apple.RemoteManagement', 0, 2, 4, 1, NULL, NULL, 0, 'UNUSED', NULL, 0, strftime('%s','now'));" 2>/dev/null || true
            done
            sudo killall tccd 2>/dev/null || true
          fi

          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"
          sudo "$KICKSTART" -deactivate -stop 2>/dev/null || true
          sleep 2
          sudo "$KICKSTART" \
            -activate -configure -access -on -restart -agent -privs -all -allowAccessFor -allUsers \
            -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$MAC_PASSWORD"
          sudo launchctl kickstart -k system/com.apple.screensharing 2>/dev/null || true

          PORT_OK=false
          for i in {1..30}; do
            if nc -z 127.0.0.1 5900 2>/dev/null; then
              PORT_OK=true
              break
            fi
            sleep 2
          done
          if [ "$PORT_OK" != "true" ]; then
            echo "::error::Server (port 5900) did not start."
            exit 1
          fi

          sudo launchctl asuser "$GUI_UID" sudo -u "$CONSOLE_USER" open -a Finder 2>/dev/null || true
          sleep 3

          # Deliver a real MV2 extension to exercise the patch. On BRANDED Google Chrome
          # 152 every automated install path is blocked: --load-extension is refused
          # ("not allowed in Google Chrome"); mandatory policy force-install needs real
          # MDM / an approved config profile; a hand-written managed-prefs plist isn't
          # served. The one path that works is the dev-mode "Load unpacked" UI (a user
          # action, not the CLI switch) — and the mem-patch is what lets MV2 load there.
          # So download uBlock Origin's MV2 build and stage it for a one-click load.
          UBO_ID=fkgkibajhfbepljeaefdnfnegdcjomkh
          UBO_SRC=""
          UBO_DIR=/tmp/ubo
          rm -rf "$UBO_DIR"; mkdir -p "$UBO_DIR"
          UBO_URL=$(curl -fsSL https://api.github.com/repos/gorhill/uBlock/releases/latest 2>/dev/null \
                    | grep -o 'https://[^"]*\.chromium\.zip' | head -1)
          if [ -n "$UBO_URL" ] && curl -fsSL "$UBO_URL" -o /tmp/ubo.zip 2>/dev/null \
               && unzip -oq /tmp/ubo.zip -d "$UBO_DIR" 2>/dev/null; then
            UBO_SRC="$(dirname "$(find "$UBO_DIR" -name manifest.json 2>/dev/null | head -1)")"
            if [ -f "$UBO_SRC/manifest.json" ]; then
              MFV="$(grep -o '"manifest_version"[^,]*' "$UBO_SRC/manifest.json" | head -1)"
              echo "🧩 uBlock MV2 build → $UBO_SRC ($MFV) from $(basename "$UBO_URL")"
            else
              UBO_SRC=""
            fi
          fi
          [ -z "$UBO_SRC" ] && echo "::warning::could not fetch the uBlock MV2 build"

          # macOS equivalent of Windows' HKLM\Software\Policies\Google\Chrome + ExtensionSettings:
          # a CONFIGURATION PROFILE with a com.google.Chrome payload. It's the mandatory,
          # persistent, machine-wide policy channel (no registry on macOS; user-domain
          # `defaults` is "recommended" only = no force-install). force_installed is the
          # one extension-install path branded Chrome still honors, so uBlock reinstalls
          # and persists. macOS 13+ may require a one-time approval in
          # System Settings > Privacy & Security > Profiles.
          POLICY_MC=/tmp/chrome-mv2.mobileconfig
          cat > "$POLICY_MC" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>PayloadContent</key><array><dict>
              <key>PayloadType</key><string>com.google.Chrome</string>
              <key>PayloadIdentifier</key><string>com.google.Chrome.mv2</string>
              <key>PayloadUUID</key><string>1D9E2F70-0000-4000-8000-000000000001</string>
              <key>PayloadVersion</key><integer>1</integer>
              <key>PayloadEnabled</key><true/>
              <key>PayloadDisplayName</key><string>Chrome MV2 ExtensionSettings</string>
              <key>ExtensionSettings</key><dict>
                <key>fkgkibajhfbepljeaefdnfnegdcjomkh</key><dict>
                  <key>installation_mode</key><string>force_installed</string>
                  <key>update_url</key><string>https://github.com/gorhill/uBlock/raw/refs/heads/master/dist/chromium/update.xml</string>
                </dict>
              </dict>
            </dict></array>
            <key>PayloadType</key><string>Configuration</string>
            <key>PayloadIdentifier</key><string>mv2.testbed.chrome.policy</string>
            <key>PayloadUUID</key><string>1D9E2F70-0000-4000-8000-000000000002</string>
            <key>PayloadVersion</key><integer>1</integer>
            <key>PayloadScope</key><string>System</string>
            <key>PayloadDisplayName</key><string>MV2 uBlock Policy (Chrome)</string>
          </dict></plist>
          PLIST
          if sudo profiles install -type=configuration -path="$POLICY_MC" 2>/tmp/prof.err; then
            echo "🧩 installed Chrome ExtensionSettings via configuration profile (force_installed)"
          else
            echo "::warning::profiles install did not auto-apply (needs approval in System Settings > Profiles): $(head -1 /tmp/prof.err 2>/dev/null)"
          fi

          # Resolve the console user's real home (RecordName may be aliased to admin
          # while the home dir stays /Users/<runner>), for the on-disk extension check.
          CONSOLE_HOME=$(dscl . -read "/Users/$CONSOLE_USER" NFSHomeDirectory 2>/dev/null | awk '{print $2}')
          [ -n "$CONSOLE_HOME" ] || CONSOLE_HOME="/Users/$CONSOLE_USER"

          # Stage the unpacked uBlock MV2 + the policy profile on the Desktop, so in the
          # desktop you can either double-click chrome-mv2.mobileconfig to install/approve
          # the policy (persistent force-install), or Load unpacked uBlock0-MV2 (one-off).
          UBO_DESKTOP=""
          if [ -n "$UBO_SRC" ]; then
            UBO_DESKTOP="$CONSOLE_HOME/Desktop/uBlock0-MV2"
            rm -rf "$UBO_DESKTOP" 2>/dev/null || true
            cp -R "$UBO_SRC" "$UBO_DESKTOP" 2>/dev/null && chown -R "$CONSOLE_USER" "$UBO_DESKTOP" 2>/dev/null || \
              sudo cp -R "$UBO_SRC" "$UBO_DESKTOP" 2>/dev/null || true
            echo "🧩 staged uBlock MV2 → $UBO_DESKTOP"
          fi
          cp "$POLICY_MC" "$CONSOLE_HOME/Desktop/chrome-mv2.mobileconfig" 2>/dev/null \
            && chown "$CONSOLE_USER" "$CONSOLE_HOME/Desktop/chrome-mv2.mobileconfig" 2>/dev/null || true

          # Stop Google Keystone auto-update this session: an auto-update drops a fresh
          # STOCK main executable (no LSEnvironment/re-sign), so the dylib stops loading
          # and MV2 turns off again. Disabling the update check keeps the patch alive.
          sudo -u "$CONSOLE_USER" defaults write com.google.Keystone.Agent checkInterval 0 2>/dev/null || true
          sudo defaults write /Library/Preferences/com.google.Keystone.Agent checkInterval 0 2>/dev/null || true
          sudo -u "$CONSOLE_USER" launchctl remove com.google.keystone.agent 2>/dev/null || true

          # Runtime check. Launch Chrome the NORMAL way (LaunchServices/`open`, in the
          # GUI session) so the dyld method's Info.plist LSEnvironment takes effect. We
          # detect success by whether our dylib (Contents/MacOS/mv) is actually mapped
          # into the running Chrome process — method-agnostic, no debug stderr needed —
          # plus whether the policy-forced MV2 uBlock lands on disk. Chrome stays up in
          # the desktop, with the Widevine VMP lab opened for the DRM check.
          CHROME_APP="/Applications/Google Chrome.app"
          CHROME_BIN="$CHROME_APP/Contents/MacOS/Google Chrome"
          MV2_RUNTIME="⏭️ patch not applied — Chrome is stock (install step did not patch)"
          MV2_EXT="⏭️ open Chrome in the desktop to see whether the MV2 extension loads"
          MV2_DRM="❓ open https://castlabs.github.io/wv-vmp-lab/ in the desktop — it must NOT show \`PLATFORM_TAMPERED\`"
          if [ -x "$CHROME_BIN" ]; then
            # The ad-hoc re-signed Chrome is an "unidentified developer"; launching via
            # LaunchServices (`open`) pops a Gatekeeper dialog that blocks forever on a
            # headless runner. Disable Gatekeeper + clear quarantine for the desktop's
            # normal-launch path.
            sudo spctl --master-disable 2>/dev/null || true
            sudo xattr -dr com.apple.quarantine "$CHROME_APP" 2>/dev/null || true

            # Diagnostic launch: run the exe DIRECTLY (no Gatekeeper) with debug logging
            # and, for the dyld method, DYLD_INSERT_LIBRARIES set explicitly (equivalent
            # to the LSEnvironment a normal launch uses). Redirect stderr INSIDE the user
            # context so we capture the dylib's [mv2patch] trace and learn whether it
            # actually flipped the MV2 gates.
            if [ "${MV2_INJECT:-dyld}" = dyld ]; then
              ENVV="DYLD_INSERT_LIBRARIES=@executable_path/mv MV2_MEMPATCH_DEBUG=1"
            else
              ENVV="MV2_MEMPATCH_DEBUG=1"
            fi
            CHROME_LOG=/tmp/chrome-mv2.log
            sudo rm -f "$CHROME_LOG" 2>/dev/null || true
            sudo -u "$CONSOLE_USER" rm -f "$CONSOLE_HOME/Library/Logs/DiagnosticReports/"*.ips 2>/dev/null || true
            echo "🧪 runtime check: launching Chrome ($ENVV) → loading a real page ..."
            sudo launchctl asuser "$GUI_UID" sudo -u "$CONSOLE_USER" \
              bash -c "$ENVV '$CHROME_BIN' --no-first-run --no-default-browser-check https://example.com > '$CHROME_LOG' 2>&1" &
            sleep 20
            sudo cp "$CHROME_LOG" chrome-mv2.log 2>/dev/null || true
            sudo chmod 644 chrome-mv2.log 2>/dev/null || true
            echo "----- chrome-mv2.log (Chrome stderr) -----"
            sed -n '1,40p' chrome-mv2.log 2>/dev/null || true
            [ -s chrome-mv2.log ] || echo "(empty)"
            MV2_LOG=$(grep -a '\[mv2patch\]' chrome-mv2.log 2>/dev/null || true)

            echo "----- Google Chrome processes (renderers = --type=renderer) -----"
            pgrep -fl 'Contents/MacOS/Google Chrome' 2>/dev/null | head -12 || echo "(no Chrome process running)"

            echo "----- recent crash reports (which process crashed & why) -----"
            CR_DIR="$CONSOLE_HOME/Library/Logs/DiagnosticReports"
            sudo find "$CR_DIR" -name '*.ips' 2>/dev/null | sort | tail -4 | while IFS= read -r f; do
              echo "=== $(basename "$f") ==="
              sudo sed -n '1,30p' "$f" 2>/dev/null \
                | grep -iE '"procName"|"exceptionType"|"signal"|"termination"|reason|"role"|dyld|Library not loaded|not valid|code sign' | head -12
            done

            # Is our dylib mapped into any Chrome process (the browser)?
            DYLIB_LOADED=false
            for p in $(pgrep -f 'Contents/MacOS/Google Chrome' 2>/dev/null); do
              if sudo lsof -p "$p" 2>/dev/null | grep -q '/Contents/MacOS/mv'; then DYLIB_LOADED=true; break; fi
            done
            if printf '%s' "$MV2_LOG" | grep -qi 'ENABLED\|patched in memory'; then
              echo "✅ [mv2patch] reports the MV2 gates were flipped in memory"
              MV2_RUNTIME="✅ dylib loaded & MV2 gates patched (\`${MV2_INJECT:-dyld}\`)"
            elif [ "$DYLIB_LOADED" = true ] && [ -n "$MV2_LOG" ]; then
              echo "::warning::dylib loaded & logged but did NOT report a gate patch — signatures.json coverage?"
              MV2_RUNTIME="⚠️ dylib loaded but no gate patched (see [mv2patch] / signatures.json)"
            elif [ "$DYLIB_LOADED" = true ]; then
              echo "✅ dylib mapped into Chrome (no debug trace captured)"
              MV2_RUNTIME="✅ dylib loaded (\`${MV2_INJECT:-dyld}\`); patch trace not captured"
            elif pgrep -f 'Contents/MacOS/Google Chrome' >/dev/null 2>&1; then
              echo "::warning::Chrome is running but the mv2 dylib is not mapped — injection didn't take"
              MV2_RUNTIME="⚠️ Chrome runs but dylib not injected — verify in the desktop"
            else
              echo "::warning::Chrome did not stay running (likely killed at launch) — see AMFI log below"
              MV2_RUNTIME="⚠️ Chrome did not launch (killed?) — see run log"
              echo "----- AMFI / code-signing kill reason (last 2m) -----"
              sudo log show --last 2m 2>/dev/null \
                | grep -iE "google chrome|amfi|library validation|code signature|invalid signat|not valid|killed:" \
                | grep -viE "screensharing|cloudflared|novnc" | tail -25
            fi

            # Did the policy profile auto-apply? A force_installed extension lands in
            # Default/Extensions/<id>. If the profile needed approval it won't yet, and
            # the staged Desktop copies (profile + unpacked uBlock) are the fallback.
            EXT_DIR="$CONSOLE_HOME/Library/Application Support/Google/Chrome/Default/Extensions/$UBO_ID"
            for i in {1..20}; do sudo test -d "$EXT_DIR" && break; sleep 3; done
            if sudo test -d "$EXT_DIR"; then
              echo "✅ uBlock force-installed by the profile policy ($EXT_DIR)"
              MV2_EXT="✅ uBlock (MV2) **force-installed by the configuration-profile policy** — persistent. Confirm at \`chrome://extensions\` / \`chrome://policy\`."
            elif [ -n "$UBO_DESKTOP" ]; then
              echo "policy not auto-applied yet (likely awaiting profile approval)"
              MV2_EXT="🧩 Policy profile staged (force_installed uBlock). If \`chrome://policy\` is empty, double-click **\`chrome-mv2.mobileconfig\`** on the Desktop → approve in **System Settings > Profiles**, relaunch Chrome. One-off: Load unpacked **\`uBlock0-MV2\`** from the Desktop."
            else
              MV2_EXT="⚠️ couldn't stage uBlock — download uBlock Origin's chromium build and Load unpacked it in the desktop"
            fi

            # DRM gate: open the castLabs Widevine VMP lab so it's ready to inspect.
            # Widevine provisioning may need a moment on a fresh Chrome; verify in the
            # desktop that it does NOT report PLATFORM_TAMPERED.
            sudo launchctl asuser "$GUI_UID" sudo -u "$CONSOLE_USER" \
              open -a "$CHROME_APP" "https://castlabs.github.io/wv-vmp-lab/" 2>/dev/null || true
          fi

          # Smoke mode: report and stop before the (6h) VNC desktop so the run
          # self-completes and the full log is readable without cancel-timing games.
          if [ "${SMOKE_TEST:-false}" = "true" ]; then
            echo "🔬 SMOKE_TEST complete (method=${MV2_INJECT:-dyld}) — skipping VNC desktop + keepalive."
            echo "RESULT | runtime: $MV2_RUNTIME"
            echo "RESULT | extension: $MV2_EXT"
            echo "RESULT | drm: (needs the desktop / Widevine provisioning — not auto-checked)"
            exit 0
          fi

          perl -0pi -e 's/return clientTypes\.includes\(type\);/return type === securityTypeVNCAuth;/' /tmp/noVNC/core/rfb.js
          if ! grep -q "return type === securityTypeVNCAuth" /tmp/noVNC/core/rfb.js; then
            echo "::warning::Client patch failed."
          fi
          /tmp/noVNC/utils/novnc_proxy --vnc localhost:5900 --listen 127.0.0.1:6080 > novnc.log 2>&1 &
          sleep 3

          # Two tunnels: HTTPS for browser access (noVNC), TCP for native VNC clients
          cloudflared tunnel --url http://localhost:6080 --no-autoupdate > cloudflared.log 2>&1 &
          cloudflared tunnel --url tcp://localhost:5900 --no-autoupdate > cloudflared-tcp.log 2>&1 &

          wait_for_tunnel_url() {
            local LOGFILE="$1" URL
            for i in {1..30}; do
              URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.trycloudflare\.com' "$LOGFILE" | tail -n 1) || true
              if [ -n "$URL" ]; then
                printf '%s\n' "$URL"
                return 0
              fi
              sleep 1
            done
            return 1
          }

          TUNNEL_URL=$(wait_for_tunnel_url cloudflared.log) || true
          TCP_TUNNEL_URL=$(wait_for_tunnel_url cloudflared-tcp.log) || true

          if [ -z "$TUNNEL_URL" ] || [ -z "$TCP_TUNNEL_URL" ]; then
            echo "::error::Failed to start Cloudflare tunnel(s)!"
            cat cloudflared.log cloudflared-tcp.log
            exit 1
          fi

          SESSION_URL="${TUNNEL_URL}/vnc.html?autoconnect=true&resize=remote"

          echo "🌐 Browser: $SESSION_URL"
          echo "🔌 Native VNC: run 'cloudflared access tcp --hostname $TCP_TUNNEL_URL --url localhost:5900' locally, then connect your VNC client to localhost:5900"

          # --- clipboard + file bridge (host clipboard/files -> Mac) ----------
          # macOS's built-in VNC server doesn't sync the clipboard with noVNC or
          # third-party clients, so this tiny page pbcopy's text you paste and drops
          # uploaded files into the desktop user's ~/Downloads. Token-gated, its own
          # tunnel. Runs as the console user so pbcopy/Downloads hit the GUI session.
          PY3=$(command -v python3 || echo /usr/bin/python3)
          CLIP_PORT=8091
          CLIP_TOKEN=$(openssl rand -hex 8 2>/dev/null || printf '%s%s' "$RANDOM" "$RANDOM")
          cat > /tmp/clipbridge.py <<'PYEOF'
          import http.server, subprocess, os, urllib.parse, pwd
          TOKEN = os.environ.get('CLIP_TOKEN', '')
          PORT = int(os.environ.get('CLIP_PORT', '8091'))
          DL = os.path.join(pwd.getpwuid(os.geteuid()).pw_dir, 'Downloads')
          os.makedirs(DL, exist_ok=True)
          PREFIX = '/' + TOKEN
          PAGE = ("<!doctype html><meta charset=utf-8><title>Mac bridge</title>"
                  "<style>body{font:14px system-ui;margin:2rem;max-width:640px}"
                  "textarea{width:100%;height:9rem}button{padding:.5rem 1rem;margin:.4rem .4rem 0 0}"
                  "#log{color:#555;white-space:pre-wrap;margin-top:.6rem}</style>"
                  "<h2>Clipboard &amp; file bridge &rarr; Mac</h2>"
                  "<textarea id=t placeholder='Text to push to the Mac clipboard'></textarea><br>"
                  "<button onclick=push()>Push to Mac clipboard</button>"
                  "<button onclick=pull()>Pull Mac clipboard</button>"
                  "<h3>Upload to ~/Downloads</h3>"
                  "<input type=file id=f multiple> <button onclick=up()>Upload</button>"
                  "<div id=log></div><script>"
                  "const L=m=>document.getElementById('log').textContent=m;"
                  "async function push(){await fetch('clip',{method:'POST',body:document.getElementById('t').value});L('sent to Mac clipboard')}"
                  "async function pull(){document.getElementById('t').value=await (await fetch('clip')).text();L('pulled Mac clipboard')}"
                  "async function up(){for(const x of document.getElementById('f').files){await fetch('put/'+encodeURIComponent(x.name),{method:'PUT',body:x});L('uploaded '+x.name)}}"
                  "</script>")
          class H(http.server.BaseHTTPRequestHandler):
              def reply(self, code, body, ctype='text/plain; charset=utf-8'):
                  b = body.encode() if isinstance(body, str) else body
                  self.send_response(code)
                  self.send_header('Content-Type', ctype)
                  self.send_header('Content-Length', str(len(b)))
                  self.end_headers()
                  try:
                      self.wfile.write(b)
                  except Exception:
                      pass
              def rel(self):
                  if self.path == PREFIX or self.path.startswith(PREFIX + '/'):
                      return self.path[len(PREFIX):] or '/'
                  return None
              def do_GET(self):
                  r = self.rel()
                  if r is None:
                      return self.reply(403, 'forbidden')
                  if r == '/':
                      return self.reply(200, PAGE, 'text/html; charset=utf-8')
                  if r == '/clip':
                      return self.reply(200, subprocess.run(['pbpaste'], capture_output=True).stdout)
                  return self.reply(404, 'nope')
              def do_POST(self):
                  r = self.rel()
                  if r is None:
                      return self.reply(403, 'forbidden')
                  if r == '/clip':
                      n = int(self.headers.get('Content-Length', 0) or 0)
                      subprocess.run(['pbcopy'], input=self.rfile.read(n))
                      return self.reply(200, 'ok')
                  return self.reply(404, 'nope')
              def do_PUT(self):
                  r = self.rel()
                  if r is None:
                      return self.reply(403, 'forbidden')
                  if not r.startswith('/put/'):
                      return self.reply(404, 'nope')
                  name = os.path.basename(urllib.parse.unquote(r[5:])) or 'file'
                  n = int(self.headers.get('Content-Length', 0) or 0)
                  with open(os.path.join(DL, name), 'wb') as fh:
                      fh.write(self.rfile.read(n))
                  return self.reply(200, 'saved ' + name)
              def log_message(self, *a):
                  pass
          http.server.HTTPServer(('127.0.0.1', PORT), H).serve_forever()
          PYEOF
          sudo launchctl asuser "$GUI_UID" sudo -u "$CONSOLE_USER" \
            env CLIP_TOKEN="$CLIP_TOKEN" CLIP_PORT="$CLIP_PORT" "$PY3" /tmp/clipbridge.py \
            > clipbridge.log 2>&1 &
          sleep 2
          cloudflared tunnel --url http://localhost:$CLIP_PORT --no-autoupdate > cloudflared-clip.log 2>&1 &
          CLIP_TUNNEL_URL=$(wait_for_tunnel_url cloudflared-clip.log) || true
          if [ -n "$CLIP_TUNNEL_URL" ]; then
            CLIP_URL="${CLIP_TUNNEL_URL}/${CLIP_TOKEN}/"
            echo "📋 Clipboard/file bridge: $CLIP_URL"
          else
            CLIP_URL=""
            echo "::warning::clipboard bridge tunnel did not come up"
          fi

          {
            echo "### macOS $ARCH — MV2 testbed"
            echo "- 🧩 **MV2 mem-patch:** $MV2_RUNTIME"
            echo "- 🧪 **MV2 extension:** $MV2_EXT"
            echo "- 🎬 **Widevine DRM:** $MV2_DRM"
            echo "- 👀 **To confirm MV2:** \`chrome://extensions\` should show **uBlock Origin (MV2)** force-installed by policy (\`chrome://policy\` lists ExtensionSettings). If policy is empty, double-click **\`chrome-mv2.mobileconfig\`** on the Desktop and approve it in **System Settings > Profiles**, then relaunch Chrome. One-off alternative: Developer mode → **Load unpacked** → **\`uBlock0-MV2\`**."
            echo "- 🌐 [Open Desktop (browser)](${SESSION_URL})"
            echo "- 🔌 **Native VNC client:** run \`cloudflared access tcp --hostname ${TCP_TUNNEL_URL} --url localhost:5900\` locally, then connect your VNC client to \`localhost:5900\`"
            [ -n "$CLIP_URL" ] && echo "- 📋 **Clipboard / files → Mac:** [$CLIP_URL]($CLIP_URL) — paste text to set the Mac clipboard, or upload files to \`~/Downloads\` (anyone with this URL can too)"
            echo "- 👤 **Username:** \`$CONSOLE_USER\`"
          } >> "$GITHUB_STEP_SUMMARY"

          end=$((SECONDS + 21600))
          TUNNEL_FAILURES=0
          while [ $SECONDS -lt $end ]; do
            if ! nc -z 127.0.0.1 5900 2>/dev/null; then
              echo "⚠️ 5900 down - restarting screensharing..."
              sudo launchctl kickstart -k system/com.apple.screensharing 2>/dev/null || true
              sleep 4
            fi
            if ! nc -z 127.0.0.1 6080 2>/dev/null; then
              echo "⚠️ 6080 down - restarting noVNC..."
              pkill -f novnc_proxy 2>/dev/null || true
              /tmp/noVNC/utils/novnc_proxy --vnc localhost:5900 --listen 127.0.0.1:6080 >> novnc.log 2>&1 &
            fi

            # Browser tunnel: probe it end-to-end; restart cloudflared after 2 consecutive failures
            if curl -sf -m 15 "${TUNNEL_URL}/vnc.html" > /dev/null 2>&1; then
              TUNNEL_FAILURES=0
            else
              TUNNEL_FAILURES=$((TUNNEL_FAILURES + 1))
              echo "⚠️ browser tunnel unreachable ($TUNNEL_FAILURES/2)"
              if [ "$TUNNEL_FAILURES" -ge 2 ]; then
                echo "⚠️ restarting HTTP tunnel..."
                pkill -f "cloudflared tunnel --url http://localhost:6080" 2>/dev/null || true
                sleep 2
                cloudflared tunnel --url http://localhost:6080 --no-autoupdate >> cloudflared.log 2>&1 &
                TUNNEL_URL=$(wait_for_tunnel_url cloudflared.log) || true
                if [ -n "$TUNNEL_URL" ]; then
                  SESSION_URL="${TUNNEL_URL}/vnc.html?autoconnect=true&resize=remote"
                  echo "🌐 New browser URL: $SESSION_URL"
                  echo "- 🌐 [Open Desktop (browser) - tunnel restarted](${SESSION_URL})" >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "::warning::HTTP tunnel restart did not produce a URL."
                fi
                TUNNEL_FAILURES=0
              fi
            fi

            # Native client tunnel: just needs a live process
            if ! pgrep -f "cloudflared tunnel --url tcp://localhost:5900" > /dev/null 2>&1; then
              echo "⚠️ TCP tunnel down - restarting..."
              cloudflared tunnel --url tcp://localhost:5900 --no-autoupdate >> cloudflared-tcp.log 2>&1 &
              TCP_TUNNEL_URL=$(wait_for_tunnel_url cloudflared-tcp.log) || true
              if [ -n "$TCP_TUNNEL_URL" ]; then
                echo "🔌 New native VNC host: $TCP_TUNNEL_URL"
                echo "- 🔌 **Native VNC (tunnel restarted):** \`cloudflared access tcp --hostname ${TCP_TUNNEL_URL} --url localhost:5900\`" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi

            # Clipboard/file bridge: keep both the server and its tunnel alive
            if [ -n "$CLIP_URL" ]; then
              if ! pgrep -f clipbridge.py > /dev/null 2>&1; then
                echo "⚠️ clip bridge down - restarting..."
                sudo launchctl asuser "$GUI_UID" sudo -u "$CONSOLE_USER" \
                  env CLIP_TOKEN="$CLIP_TOKEN" CLIP_PORT="$CLIP_PORT" "$PY3" /tmp/clipbridge.py >> clipbridge.log 2>&1 &
              fi
              if ! pgrep -f "cloudflared tunnel --url http://localhost:$CLIP_PORT" > /dev/null 2>&1; then
                echo "⚠️ clip tunnel down - restarting..."
                cloudflared tunnel --url http://localhost:$CLIP_PORT --no-autoupdate >> cloudflared-clip.log 2>&1 &
              fi
            fi

            echo "✓ alive - $(date '+%H:%M:%S')"
            sleep 300
          done

      - name: Upload logs
        # Only a genuine failure keeps logs; closing the session (cancel) or a
        # normal end leaves nothing behind.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.ARCH }}
          path: |
            cloudflared.log
            cloudflared-tcp.log
            cloudflared-clip.log
            novnc.log
            caffeinate.log
            chrome-mv2.log
            clipbridge.log
          if-no-files-found: ignore

      - name: Remove logs
        if: always()
        run: rm -f cloudflared.log cloudflared-tcp.log cloudflared-clip.log novnc.log caffeinate.log chrome-mv2.log clipbridge.log
